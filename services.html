<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services | ABSTRUCT Construction</title>
  <meta name="description" content="Residential construction, commercial construction and project management from ABSTRUCT. End-to-end construction solutions tailored to your needs.">
  <meta name="theme-color" content="#EBE5DC">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Libre+Caslon+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/inner.css">
</head>
<body data-page="services" data-theme="light">
<main id="main">

  <section class="phead" data-theme="light">
    <div class="wrap phead__grid">
      <div>
        <p class="label rv">/ Services</p>
        <h1 class="display" data-in>
          <span class="ln"><span style="--i:0">Our</span></span>
          <span class="ln"><span style="--i:1">Services</span></span>
        </h1>
      </div>
      <div class="phead__side rv" style="--d:.2s">
        <p>From vision to structure, we deliver end-to-end construction solutions tailored to your needs.</p>
        <nav class="chips" id="svcChips" aria-label="Jump to a service"></nav>
      </div>
    </div>
  </section>

  <div id="panels"><noscript><p class="wrap">Enable JavaScript to see our services.</p></noscript></div>

  <section class="sec" data-theme="light" aria-labelledby="proc-h">
    <div class="wrap">
      <div class="sec__head">
        <div class="rv"><p class="idx">/ How we work</p><h2 class="big" id="proc-h">Three stages. One team.</h2></div>
        <div class="sec__side rv" style="--d:.1s"><p>Design, build, deliver, with no handoffs you have to chase.</p></div>
      </div>
      <ol class="steps" id="steps" data-in></ol>
    </div>
  </section>

  <section class="sec" data-theme="light" aria-labelledby="faq-h" style="padding-top:0">
    <div class="wrap">
      <div class="sec__head" style="border-bottom:0;margin-bottom:0;padding-bottom:1rem">
        <div class="rv"><p class="idx">/ Questions</p><h2 class="big" id="faq-h">Before you ask</h2></div>
      </div>
      <div class="faq rv" id="faq"></div>
    </div>
  </section>

</main>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/services.js"></script>
</body>
</html>
